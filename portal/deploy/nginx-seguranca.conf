# Cabeçalhos de segurança. O Nginx só herda o add_header do nível acima quando o location não
# define nenhum; como alguns locations definem o Cache-Control, todos incluem este arquivo.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
