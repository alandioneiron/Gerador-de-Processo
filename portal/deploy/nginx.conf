# Portal Neoguard — Nginx (porta 80 do container "web", publicada como 8090 no servidor).
# Este arquivo vira /etc/nginx/conf.d/default.conf (contexto http), por isso só tem o bloco server.
#
#   /                  SPA do portal (React), com fallback para o index.html
#   /api/              API (FastAPI) em api:8000, repassando o caminho completo /api/...
#   /propostas/        Gerador de Propostas estático
#   /propostas/data/   cadastro REAL, vindo do volume do servidor (nunca está na imagem nem no git)

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;

    # Atrás da porta publicada (8090 -> 80), um redirect absoluto sairia com a porta 80 e quebraria.
    # Com "off" o Nginx devolve redirects relativos (Location: /propostas/).
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml;

    # DNS interno do Docker. Com o proxy_pass por variável (abaixo), o Nginx resolve "api" a cada
    # uso: o container "web" sobe mesmo se a API ainda não existe e acompanha o IP novo quando a
    # API é recriada num deploy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabeçalhos de segurança. Os locations que definem o próprio Cache-Control incluem o mesmo
    # arquivo, porque o add_header de um location substitui o do nível acima.
    include /etc/nginx/snippets/seguranca.conf;

    # Dotfiles (.env, .git...) nunca são servidos.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # ---- API ---------------------------------------------------------------------------------
    location ^~ /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;   # sem URI no proxy_pass: o caminho /api/... segue intacto

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-store" always;
    }

    # ---- Gerador de Propostas ----------------------------------------------------------------
    location = /propostas {
        return 301 /propostas/;
    }

    # Sem hash nos nomes (js/app.js, index.html...): o navegador sempre revalida (ETag), então um
    # deploy novo aparece na hora, sem apagar cache.
    location /propostas/ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /propostas/version.json {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-store" always;
    }

    # Cadastro real: vem do volume (CADASTRO_DIR no servidor), montado somente leitura. Só os 4
    # arquivos que o Gerador lê são servidos; qualquer outra coisa que alguém deixe na pasta
    # (cadastro.json original, backups...) devolve 404. Arquivo novo no Gerador = incluir aqui.
    location ~ ^/propostas/data/(?<arq>config|ccts|municipios|site)\.json$ {
        alias /usr/share/nginx/html/propostas/data/$arq.json;
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-store" always;
    }

    location /propostas/data/ {
        return 404;
    }

    # ---- SPA do portal -----------------------------------------------------------------------
    # Arquivos do Vite têm hash no nome: cache longo. Se não existe, é 404 de verdade (o
    # Cache-Control sem "always" só vale para respostas de sucesso, nunca para o 404).
    location /assets/ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O index.html nunca fica em cache, para o navegador sempre achar os assets novos.
    location = /index.html {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Rotas do React Router (/fichas/12...) caem no index.html.
    location / {
        try_files $uri /index.html;
    }
}
