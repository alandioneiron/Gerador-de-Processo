name: CI

# Roda a bateria de testes em todo Pull Request para a main e em todo push na main.
# Merge na main NÃO publica em produção: apenas gera uma prévia do site (artifact).
# Produção só sai por Release (ver release.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um PR novo cancela a execução anterior do mesmo PR; pushes na main nunca são cancelados.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validar:
    name: Validação e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar os dados (data/)
        run: npm run validate

      - name: Testes unitários
        run: npm test

  e2e:
    name: Testes E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright)
        run: npm run test:e2e

      - name: Guardar relatório e evidências da falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-falha
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ---- Portal Neoguard (portal/) -----------------------------------------------------------
  # Rodam sempre (sem filtro de caminho): assim nenhum check obrigatório fica "pendente" e o
  # contrato do Portal é conferido em todo PR. Ver docs/portal/ESPEC-FASE1.md.
  portal-backend:
    name: Portal — backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/backend/requirements*.txt

      - name: Instalar dependências
        run: pip install -r portal/backend/requirements.txt -r portal/backend/requirements-dev.txt

      - name: Testes do backend (pytest)
        working-directory: portal/backend
        run: python -m pytest

  portal-frontend:
    name: Portal — frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal/frontend
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes do frontend
        run: npm test -- --run

      - name: Build do frontend
        run: npm run build

  portal-docker:
    name: Portal — imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      # Só constrói (nada é publicado). O contexto é a raiz do repositório.
      - name: Construir a imagem da API
        run: docker build -f portal/deploy/Dockerfile.api --build-arg GIT_SHA="$GITHUB_SHA" -t portal-neoguard-api:ci .

      - name: Construir a imagem do Nginx (SPA + Gerador)
        run: docker build -f portal/deploy/Dockerfile.web --build-arg GIT_SHA="$GITHUB_SHA" -t portal-neoguard-web:ci .

      # Sobe a pilha toda num projeto descartável e testa /, /api/saude e /propostas/.
      # As imagens vêm do cache dos dois builds acima.
      - name: Teste de fumaça da pilha (docker compose)
        run: bash portal/deploy/smoke.sh

  previa:
    name: Prévia do site
    # Só depois do merge (push na main) e com tudo verde.
    if: github.event_name == 'push'
    needs: [validar, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir a versão da prévia (main-<commit curto>)
        run: echo "RELEASE_TAG=main-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Gerar o site (dist/)
        run: npm run build

      - name: Guardar a prévia como artifact
        uses: actions/upload-artifact@v6
        with:
          name: site-previa
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Resumo
        run: |
          {
            echo "## Prévia do site gerada"
            echo
            echo "- Versão da prévia: \`${RELEASE_TAG}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact: **site-previa** (guardado por 14 dias)"
            echo
            echo "> Esta é apenas uma **prévia** para conferência. O merge na \`main\` **não** publica em produção."
            echo "> A produção (GitHub Pages) só é atualizada quando uma **Release** nova é publicada."
          } >> "$GITHUB_STEP_SUMMARY"
